server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lcb_interview?useUnicode=true&characterEncoding=utf-8&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  threads:
    virtual:
      enabled: true

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.lcbinterview: info
    com.baomidou.mybatisplus: warn

admin:
  token: ${ADMIN_TOKEN:dev-admin-token-change-me}

cors:
  # 生产环境通过环境变量 CORS_ALLOWED_ORIGINS 指定白名单域名，逗号分隔
  # 例：https://interview.example.com,https://admin.example.com
  # 留空时开发环境默认允许所有来源
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

app:
  auth:
    secret: ${APP_AUTH_SECRET:dev-user-auth-secret-change-me}
    token-ttl-hours: ${APP_AUTH_TOKEN_TTL_HOURS:168}
  membership:
    # 会员配额墙总开关：关闭时所有用户视同 PRO 全量放开，用于灰度期
    enabled: ${APP_MEMBERSHIP_ENABLED:false}
  knowledge:
    corpus:
      max-import-body-bytes: ${KNOWLEDGE_CORPUS_MAX_IMPORT_BODY_BYTES:10485760}

ai:
  interview:
    enabled: ${AI_INTERVIEW_ENABLED:true}
    timeout-ms: ${AI_INTERVIEW_TIMEOUT_MS:8000}
  deepseek:
    api-key: ${AI_OPENCODE_API_KEY:}
    model: ${AI_DEEPSEEK_MODEL:deepseek-v4-pro}
    url: ${AI_DEEPSEEK_URL:https://opencode.ai/zen/go/v1/chat/completions}
    # 1M 上下文 + max 模式
    max-tokens: 65536
    max-response-bytes: ${AI_MAX_RESPONSE_BYTES:4194304}
    thinking-tokens: 32768
  # Jev（TypeSafe System One）决策模型：状态 + 类型化问题 → 类型化答案 + 校准概率。
  # 与上方生成式 AI 相互独立，任一缺失不影响另一条链路；密钥只走环境变量，不落库。
  jev:
    enabled: ${JEV_ENABLED:false}
    # 人工闸门：默认关闭。Jev 概率在通过校准闸门证明显著优于 25% 随机基线前，不得影响推荐排序
    allow-scoring: ${JEV_ALLOW_SCORING:false}
    api-key: ${TYPESAFE_API_KEY:}
    model: ${JEV_MODEL:jev-latest}
    url: ${JEV_URL:https://api.typesafe.ai/v1/systemone}
    timeout-ms: ${JEV_TIMEOUT_MS:15000}
    # 送模型的提示词语言：zh / en。只影响 state 文案与问题文本，不影响面向用户的中文解读
    prompt-locale: ${JEV_PROMPT_LOCALE:zh}
