# 搜索引擎爬虫：优先返回预渲染静态页（prerender.mjs 生成），内容可直接被索引
map $http_user_agent $is_bot {
    default 0;
    ~*(Googlebot|Baiduspider|Bingbot|Sogou|360Spider|YisouSpider|Bytespider|YandexBot|SemrushBot|AhrefsBot) 1;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location / {
        if ($is_bot = 1) {
            rewrite ^/question/(\d+)/?$ /prerender/question/$1/index.html break;
            rewrite ^/bank/(\d+)/?$ /prerender/bank/$1/index.html break;
            rewrite ^/?$ /prerender/index.html break;
        }
        try_files $uri $uri/ /index.html;
    }

    location /sitemap.xml {
        try_files /prerender/sitemap.xml =404;
    }

    location /robots.txt {
        try_files /prerender/robots.txt =404;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }
}
